server:
  port: 8080

spring:
  application:
    name: team-project-be
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/team-project-db;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  generate-path: ${AI_SERVICE_GENERATE_PATH:/internal/ai/reports/generate}
  timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:60}
  local-stub-enabled: ${AI_SERVICE_LOCAL_STUB_ENABLED:true}

pipeline:
  runs-root: ${PIPELINE_RUNS_ROOT:/Users/jeongseog-u/VSCode-workspace/TeamProject2026/outputs/runs}
  run-path: ${PIPELINE_RUN_PATH:/internal/pipeline/run}
  timeout-seconds: ${PIPELINE_TIMEOUT_SECONDS:15}
