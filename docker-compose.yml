services:
  spring-api:
    build:
      context: .
    container_name: team-project-spring-api
    ports:
      - "8080:8080"
    environment:
      AI_SERVICE_BASE_URL: http://python-ai:8000
      AI_SERVICE_LOCAL_STUB_ENABLED: "false"
      PIPELINE_TIMEOUT_SECONDS: "60"
      PIPELINE_RUNS_ROOT: /pipeline/outputs/runs
    depends_on:
      - python-ai
    volumes:
      - pipeline-outputs:/pipeline/outputs
    restart: unless-stopped

  python-ai:
    build:
      context: /Users/jeongseog-u/VSCode-workspace/TeamProject2026
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TEAMPROJECT_USE_MOCK_PIPELINE: ${TEAMPROJECT_USE_MOCK_PIPELINE:-}
      TEAMPROJECT_MAX_SEARCH_RESULTS: ${TEAMPROJECT_MAX_SEARCH_RESULTS:-}
      TEAMPROJECT_MAX_READER_PAPERS: ${TEAMPROJECT_MAX_READER_PAPERS:-}
      TEAMPROJECT_MAX_RELEVANCE_RESULTS: ${TEAMPROJECT_MAX_RELEVANCE_RESULTS:-}
    container_name: team-project-python-ai
    volumes:
      - pipeline-outputs:/app/outputs
    restart: unless-stopped

volumes:
  pipeline-outputs:
